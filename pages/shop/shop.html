<div class="shop-page">
    <!-- Header with Title & Cart -->
    <header class="shop-header">
        <h1 class="shop-title">SHOP</h1>
        <div class="cart-icon-wrapper">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.8">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span class="cart-badge">2</span>
        </div>
    </header>

    <!-- Search & Filter Controls -->
    <div class="search-filter-section">
        <div class="search-bar-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8c9ba5" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="shop-search-input" placeholder="Search for products..." aria-label="Search for products">
        </div>
        <button class="filter-btn" id="filter-modal-trigger" aria-label="Filter Options">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
        </button>
    </div>

    <!-- Category Pills Navigation (Expanded for Pakistani Market) -->
    <div class="category-pills-scroll">
        <button class="pill-btn active" data-category="all">All</button>
        <button class="pill-btn" data-category="unstitched">Unstitched Suits</button>
        <button class="pill-btn" data-category="kurtis">Kurtis</button>
        <button class="pill-btn" data-category="abayas">Abayas</button>
        <button class="pill-btn" data-category="shawls">Shawls</button>
        <button class="pill-btn" data-category="formals">Formals</button>
        <button class="pill-btn" data-category="maxi">Maxis</button>
        <button class="pill-btn" data-category="dupattas">Dupattas</button>
    </div>

    <!-- Main Container: Dynamically renders Landing View or 2-Column Product Grid -->
    <div id="shop-feed" class="shop-feed-container">
        <div class="loader-container" style="min-height: calc(100vh - 250px); display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div class="spinner"></div>
            <p class="loading-title" style="color: #d4af37; margin-top: 12px; font-size: 0.9rem;">Curating Catalog...</p>
        </div>
    </div>
</div>
