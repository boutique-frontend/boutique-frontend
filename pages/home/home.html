<div class="home-page">

    <!-- =====================================================
         SANA BOUTIQUE — TOP HEADER
         ===================================================== -->
    <header class="home-brand-header">

        <button
            class="nav-menu-btn"
            type="button"
            aria-label="Open Menu"
        >
            <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
            >
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>


        <div class="brand-logo-wrapper">

            <span class="brand-logo-title">
                SANA
            </span>

            <span class="brand-logo-subtitle">
                BOUTIQUE
            </span>

            <div class="brand-logo-divider">
                ❖
            </div>

        </div>


        <button
            class="nav-cart-btn"
            type="button"
            aria-label="Shopping Cart"
        >

            <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>

            <span class="cart-badge">
                2
            </span>

        </button>

    </header>


    <!-- =====================================================
         HERO SECTION
         ===================================================== -->
    <section
        class="hero-section"
        style="background-image: url('https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=1000&auto=format&fit=crop');"
        aria-label="SANA Boutique"
    >

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <span class="hero-tagline">
                Style • Elegance • You
            </span>

            <h1 class="hero-title">
                ELEGANCE<br>
                IN EVERY<br>
                THREAD
            </h1>

            <div class="hero-gold-ornament">
                ❖
            </div>

            <p class="hero-subtitle">
                Premium Women's<br>
                Fashion &amp; Couture
            </p>


            <!-- Hero Buttons -->
            <div class="hero-actions">

                <button
                    id="heroShopNowBtn"
                    class="btn-gold-primary"
                    type="button"
                >

                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>

                    SHOP NOW

                </button>


                <button
                    id="heroExploreBtn"
                    class="btn-gold-outline"
                    type="button"
                >

                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>

                    EXPLORE COLLECTION

                </button>

            </div>


            <!-- Hero Indicators -->
            <div
                class="hero-dots"
                aria-label="Hero slides"
            >

                <span
                    class="dot active"
                    aria-label="Slide 1"
                ></span>

                <span
                    class="dot"
                    aria-label="Slide 2"
                ></span>

                <span
                    class="dot"
                    aria-label="Slide 3"
                ></span>

            </div>

        </div>

    </section>


    <!-- =====================================================
         COLLECTIONS
         ===================================================== -->
    <section
        class="collections-section"
        aria-labelledby="collections-title"
    >

        <div class="section-header">

            <span class="ornament">
                ☙
            </span>

            <h2
                id="collections-title"
                class="section-title"
            >
                OUR COLLECTIONS
            </h2>

            <span class="ornament">
                ❧
            </span>

        </div>


        <div class="collections-grid">


            <!-- UNSTITCHED -->
            <div
                class="collection-card"
                data-cat="unstitched"
                role="button"
                tabindex="0"
                aria-label="View Unstitched Suits"
            >

                <img
                    src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?q=80&w=500&auto=format&fit=crop"
                    alt="Unstitched Suits"
                    loading="lazy"
                >

                <div class="collection-card-overlay"></div>

                <div class="collection-icon-wrapper">

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                    >
                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="2"
                        ></rect>

                        <path d="M3 9h18"></path>
                    </svg>

                </div>

                <span class="collection-card-title">
                    UNSTITCHED SUITS
                </span>

                <span class="collection-card-link">
                    View All
                </span>

            </div>


            <!-- KURTIS -->
            <div
                class="collection-card"
                data-cat="kurtis"
                role="button"
                tabindex="0"
                aria-label="View Ready to Wear Kurtis"
            >

                <img
                    src="https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=500&auto=format&fit=crop"
                    alt="Ready to Wear Kurtis"
                    loading="lazy"
                >

                <div class="collection-card-overlay"></div>

                <div class="collection-icon-wrapper">

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                    >
                        <path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10a2 2 0 002 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"></path>
                    </svg>

                </div>

                <span class="collection-card-title">
                    READY TO WEAR KURTIS
                </span>

                <span class="collection-card-link">
                    View All
                </span>

            </div>


            <!-- ABAYAS -->
            <div
                class="collection-card"
                data-cat="abayas"
                role="button"
                tabindex="0"
                aria-label="View Abayas"
            >

                <img
                    src="https://images.unsplash.com/photo-1567401893414-76b7b1e5a7a5?q=80&w=500&auto=format&fit=crop"
                    alt="Abayas"
                    loading="lazy"
                >

                <div class="collection-card-overlay"></div>

                <div class="collection-icon-wrapper">

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                    >
                        <path d="M12 2a4 4 0 0 0-4 4v16h8V6a4 4 0 0 0-4-4z"></path>
                    </svg>

                </div>

                <span class="collection-card-title">
                    ABAYAS
                </span>

                <span class="collection-card-link">
                    View All
                </span>

            </div>


            <!-- SHAWLS -->
            <div
                class="collection-card"
                data-cat="shawls"
                role="button"
                tabindex="0"
                aria-label="View Shawls"
            >

                <img
                    src="https://images.unsplash.com/photo-1601924994987-69e26d50dc26?q=80&w=500&auto=format&fit=crop"
                    alt="Shawls"
                    loading="lazy"
                >

                <div class="collection-card-overlay"></div>

                <div class="collection-icon-wrapper">

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                    >
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>

                </div>

                <span class="collection-card-title">
                    SHAWLS
                </span>

                <span class="collection-card-link">
                    View All
                </span>

            </div>

        </div>

    </section>


    <!-- =====================================================
         FEATURED PRODUCT FEED
         ===================================================== -->
    <section
        class="featured-section"
        aria-labelledby="featured-title"
    >

        <div class="section-header section-header-between">

            <h2
                id="featured-title"
                class="section-title"
            >
                FEATURED FEED
            </h2>

            <a
                href="#shop"
                class="view-all-link"
            >
                View All &#10095;
            </a>

        </div>


        <!--
            IMPORTANT:
            This container is NOT a separate scroll area.

            home.js inserts the product cards here.
            The entire Home page uses normal browser scrolling.
        -->
        <div
            class="tiktok-feed-wrapper"
            id="featured-products-container"
        >

            <div class="home-empty-state">

                <div class="empty-icon">
                    ✦
                </div>

                <h3>
                    Loading collection
                </h3>

                <p>
                    Preparing the latest SANA pieces...
                </p>

            </div>

        </div>

    </section>


</div>
