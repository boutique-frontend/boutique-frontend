<div class="form-container">
    <div class="form-header">
        <h2>New Listing</h2>
        <p>Add an outfit to SAnA Boutique catalog</p>
    </div>

    <form id="postForm">
        <!-- Live Image Upload & Preview Container -->
        <div class="form-group">
            <label>Product Image</label>
            <div class="upload-area" id="uploadArea">
                <input type="file" id="postImage" accept="image/*" required>

                <div class="upload-placeholder" id="uploadPlaceholder">
                    <span class="upload-icon">📷</span>
                    <span class="upload-text">Tap to select photo</span>
                    <span class="upload-subtext">JPG, PNG, WEBP supported</span>
                </div>

                <div class="preview-container" id="previewContainer">
                    <img id="imagePreview" src="" alt="Preview">
                    <button type="button" class="remove-img-btn" id="removeImgBtn">✕</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="postTitle" placeholder="e.g. Printed Lawn 3PC" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select id="postCategory" required>
                <option value="unstitched">Unstitched</option>
                <option value="kurtis">Ready-to-Wear</option>
                <option value="abayas">Abayas & Hijabs</option>
                <option value="shawls">Shawls & Scarves</option>
                <option value="accessories">Accessories</option>
            </select>
        </div>

        <div class="form-group">
            <label>Price (Rs.)</label>
            <input type="number" id="postPrice" placeholder="e.g. 3500" required>
        </div>

        <!-- Size Chip Selector -->
        <div class="form-group">
            <label>Available Sizes</label>
            <div class="size-chips-wrapper">
                <button type="button" class="size-chip" data-size="XS">XS</button>
                <button type="button" class="size-chip" data-size="S">S</button>
                <button type="button" class="size-chip" data-size="M">M</button>
                <button type="button" class="size-chip" data-size="L">L</button>
                <button type="button" class="size-chip" data-size="XL">XL</button>
                <button type="button" class="size-chip" data-size="Free Size">Free Size</button>
            </div>
            <input type="hidden" id="postSizes">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="postDescription" rows="3" placeholder="Fabric details, embroidery notes, care info..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Publish to SAnA</button>
    </form>
</div>


<!-- =====================================================
     PASSWORD CONFIRMATION MODAL
     Hidden by default (.password-modal-overlay has no
     "active" class on load). post.js toggles it open when
     the form is submitted, and only calls the real publish
     logic once the correct password is entered.
     ===================================================== -->

<div class="password-modal-overlay" id="passwordModalOverlay">

    <div class="password-modal-backdrop" id="passwordModalBackdrop"></div>

    <div class="password-modal-card" id="passwordModalCard" role="dialog" aria-modal="true" aria-labelledby="passwordModalTitle">

        <!-- Ambient glow ring behind the lock -->
        <div class="password-modal-glow" aria-hidden="true"></div>

        <div class="password-modal-lock-wrap">
            <div class="password-modal-lock-ring"></div>
            <div class="password-modal-lock-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                </svg>
            </div>
        </div>

        <h3 id="passwordModalTitle" class="password-modal-title">Confirm Publish</h3>

        <p class="password-modal-subtitle">
            Enter the admin password to publish this listing
            to SAnA Boutique.
        </p>

        <div class="password-modal-field">
            <input
                type="password"
                id="postAdminPassword"
                class="password-modal-input"
                placeholder="Enter password"
                autocomplete="off"
                inputmode="numeric"
            >
            <button type="button" class="password-toggle-visibility" id="togglePasswordVisibility" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>

        <p class="password-modal-error" id="passwordModalError"></p>

        <div class="password-modal-actions">
            <button type="button" class="password-modal-cancel" id="passwordModalCancel">Cancel</button>
            <button type="button" class="password-modal-confirm" id="passwordModalConfirm">
                <span id="passwordModalConfirmText">Confirm &amp; Publish</span>
            </button>
        </div>

    </div>

</div>
