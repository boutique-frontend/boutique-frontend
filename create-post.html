<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Item</title>
    <link rel="stylesheet" href="css/create-post.css">
</head>
<body>

    <div class="form-container">
        <h2>Post New Clothes</h2>
        <form id="postForm">
            <div class="form-group">
                <label for="title">Product Name</label>
                <input type="text" id="title" required placeholder="e.g. Red Summer Dress">
            </div>

            <div class="form-group">
                <label for="price">Price ($)</label>
                <input type="number" id="price" step="0.01" required placeholder="29.99">
            </div>

            <div class="form-group">
                <label for="description">Description & Sizes</label>
                <textarea id="description" rows="4" required placeholder="Available in S, M, L..."></textarea>
            </div>

            <div class="form-group">
                <label for="image">Upload Photo</label>
                <input type="file" id="image" accept="image/*" required>
            </div>

            <button type="submit" class="submit-btn">Publish Item</button>
        </form>
        <a href="index.html" class="back-link">← Cancel & Back to Home</a>
    </div>

    <script src="js/create-post.js"></script>
</body>
</html>
